        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#4ECDC4", "font": {"color": "#333333"}, "id": 11, "label": "Hadoop\u67b6\u6784\u6f14\u8fdb\u4e0e\u6838\u5fc3\u7ec4\u4ef6", "shape": "dot", "size": 10.047978212708156, "title": "\u7c7b\u578b: KnowledgePoint\nPageRank: 0.00\nID: 11"}, {"color": "#45B7D1", "font": {"color": "#333333"}, "id": 64, "label": "\u751f\u6001\u5de5\u5177\u5168\u666f\u56fe", "shape": "triangle", "size": 10.01992, "title": "\u7c7b\u578b: SubKnowledgePoint\nPageRank: 0.00\nID: 64"}, {"color": "#45B7D1", "font": {"color": "#333333"}, "id": 84, "label": "YARN\u4e0eKubernetes\u8c03\u5ea6\u5668\u5bf9\u6bd4", "shape": "triangle", "size": 10.41596, "title": "\u7c7b\u578b: SubKnowledgePoint\nPageRank: 0.02\nID: 84"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#FF0000", "from": 11, "title": "\u5b66\u4e60\u6b65\u9aa4 1", "to": 64, "width": 2}, {"arrows": "to", "color": "#FF0000", "from": 64, "title": "\u5b66\u4e60\u6b65\u9aa4 2", "to": 84, "width": 2}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {

            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  network = new vis.Network(container, data, options);

                  return network;

              }
